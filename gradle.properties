# KSP 2.2.10 registers generated Kotlin sources through the legacy source-set API.
# AGP 9.3.1 requires this documented compatibility switch while built-in Kotlin is enabled.
android.disallowKotlinSourceSets=false

# KSP currently requires the explicit Kotlin Android plugin with AGP 9.
android.builtInKotlin=false

# Temporary AGP 9 compatibility bridge for plugins that still use legacy Android DSL APIs.
android.newDsl=false
